name: CI

# Lint + typecheck + unit tests on every PR and on pushes to main/develop.
# Configure branch protection to require this job before merge (see docs/BRANCHING.md).
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the i18n step can diff against the PR base / previous push.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run mobile:lint

      # winkly/no-literal-string is a warning repo-wide but an error in files this change
      # touches, so no new hard-coded text lands (docs/I18N.md).
      - name: No hard-coded text in changed files
        env:
          I18N_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run -w apps/mobile lint:i18n-changed

      - name: i18n key parity + tier-1 coverage
        run: npm run -w apps/mobile audit-i18n -- --no-lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run mobile:typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run mobile:test

  db-tests:
    name: DB security regression
    runs-on: ubuntu-latest
    # Boots the local Supabase stack, applies every migration + seed.sql, then
    # runs supabase/tests/security_hardening_test.sql as an unprivileged client.
    # SEC-1 (tier self-escalation) and SEC-2 (the user_locations coordinate leak)
    # both survived four audit cycles because nothing exercised RLS — this job is
    # what stops them coming back on a later schema change.
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      # Deterministic from supabase/config.toml ([db] port = 54322).
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase (Postgres + migrations + seed)
        # -x trims images this job never touches; keeps the DB, auth schema and
        # the roles (anon / authenticated / service_role) the test switches into.
        run: npx supabase start -x studio,edge-runtime,imgproxy

      # SEC-12 phase 2 is a script until production adopts it (see the file header);
      # apply it here so the tests always cover the final, locked-down state.
      - name: Apply last-name lockdown (SEC-12 phase 2)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/scripts/last_name_lockdown_phase2.sql

      - name: Security hardening regression test
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security_hardening_test.sql

      # SEC-7..9 (September 2026): self-join into chats/groups/plans, plan spam into
      # strangers' calendars, chat-image swap after moderation.
      - name: Membership & plans security regression test
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/security_audit_2026_09_test.sql

      - name: Data-minimisation, birthday and planner visibility tests
        run: |
          for t in data_minimization_test birthday_lockdown_test planner_invitee_visibility_test; do
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "supabase/tests/$t.sql"
          done

      # Goes through PostgREST + Auth as real users: column aliases, my_profile, and the
      # onboarding save path that owner-only columns affect (SEC-12).
      - name: Name privacy API test
        run: node supabase/tests/name_privacy_api_test.mjs

      - name: Stop Supabase
        if: always()
        run: npx supabase stop
